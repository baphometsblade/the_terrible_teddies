name: CI

# The repo previously ran only CodeQL, so a permanently failing test suite went
# unnoticed: tests/challengeFeature.test.js used Mocha globals that were never a
# dependency, and `npm test` exited non-zero on every clean checkout.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18.18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails loudly if package-lock.json is out of sync.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Boots the real app with no database to confirm demo mode still serves.
      # This is the path a fresh deploy takes.
      - name: Smoke test demo mode
        env:
          DEMO_MODE: 'true'
          SESSION_SECRET: ci-smoke-test-secret
        run: |
          node -e "
            const { createApp } = require('./server');
            const server = createApp().listen(3000, async () => {
              const checks = [
                ['/health', 200],
                ['/play', 200],
                ['/api/demo/teddies', 200],
                ['/definitely-not-a-route', 404]
              ];
              let failed = 0;
              for (const [path, want] of checks) {
                const res = await fetch('http://localhost:3000' + path);
                const ok = res.status === want;
                if (!ok) failed++;
                console.log((ok ? 'PASS' : 'FAIL') + ' ' + path + ' -> ' + res.status + ' (want ' + want + ')');
              }
              server.close(() => process.exit(failed ? 1 : 0));
            });
          "

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Advisory: the remaining high-severity findings sit in ejs -> jake ->
      # filelist -> minimatch -> brace-expansion. That chain is build tooling and
      # is never loaded when EJS renders a template, and the only patched
      # brace-expansion is a major version above what minimatch accepts. Audit
      # is reported but not gated until that resolves upstream.
      - name: Audit (report only)
        run: npm audit --audit-level=critical || true
