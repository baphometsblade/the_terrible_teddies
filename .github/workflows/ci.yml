name: CI

# The repo previously ran only CodeQL, so a permanently failing test suite went
# unnoticed: tests/challengeFeature.test.js used Mocha globals that were never a
# dependency, and `npm test` exited non-zero on every clean checkout.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Two things change without a commit. Advisories are published against
  # lockfiles that have not moved: seven appeared between two audits of this
  # repo on the same day. And ubuntu-latest and each Node line get new
  # releases. The weekly run notices either one without waiting for the next
  # push, so a push is not the first time anyone finds out.
  schedule:
    - cron: '17 3 * * 1'
  # Run by hand on another runner image to try it before ubuntu-latest moves
  # to it:  gh workflow run ci.yml -f runner=ubuntu-26.04
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to test on
        default: ubuntu-latest
        required: false

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        # 18.18 is the floor package.json declares. 20 is left out: it reached
        # end of life on 30 April 2026, and the floor and 22 bracket it. 24 is
        # the active LTS and 26 the current release (LTS from late October).
        node: ['18.18', '22', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails loudly if package-lock.json is out of sync.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Boots the real app with no database to confirm demo mode still serves.
      # This is the path a fresh deploy takes.
      - name: Smoke test demo mode
        env:
          DEMO_MODE: 'true'
          SESSION_SECRET: ci-smoke-test-secret
        run: |
          node -e "
            const { createApp } = require('./server');
            const server = createApp().listen(3000, async () => {
              const checks = [
                ['/health', 200],
                ['/play', 200],
                ['/api/demo/teddies', 200],
                ['/definitely-not-a-route', 404]
              ];
              let failed = 0;
              for (const [path, want] of checks) {
                const res = await fetch('http://localhost:3000' + path);
                const ok = res.status === want;
                if (!ok) failed++;
                console.log((ok ? 'PASS' : 'FAIL') + ' ' + path + ' -> ' + res.status + ' (want ' + want + ')');
              }
              server.close(() => process.exit(failed ? 1 : 0));
            });
          "

  audit:
    name: Dependency audit
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Production dependencies only: that is what a deploy installs.
      #
      # Pushes and pull requests report but never fail, so an advisory published
      # between two commits cannot turn an unrelated change red. The weekly run
      # does fail on a high or critical finding, which is what sends the
      # notification. When it fires, `npm audit fix` is usually the whole fix.
      - name: Audit production dependencies
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: npm audit --omit=dev --audit-level=high
