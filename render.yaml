# Which Node runs the service is decided by .node-version, not by this file
# (test/nodeVersion.test.js keeps it to a version CI tests). A NODE_VERSION
# variable would outrank that file, so do not set one here.
services:
  - type: web
    name: terrible-teddies
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: true
      - key: SESSION_SECRET
        generateValue: true
      # Render's edge names the visitor here. The rate limits count this address
      # rather than guessing how many proxies sit in front of the app. If none of
      # the first 20 requests carries it, the app logs one warning saying so.
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      - key: FOUNDER_PACK_URL
        sync: false
